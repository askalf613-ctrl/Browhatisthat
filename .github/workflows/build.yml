name: APK Derle

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Bagimliliklari kur
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
          pip install --upgrade pip
          pip install buildozer

      - name: APK derle
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log

      - name: Hata ozeti
        if: failure()
        run: |
          LOG=$(tail -n 40 build.log | sed 's/%/ /g' | cut -c1-200 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Derleme hatasi::$LOG"

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
